# ============================================================================
# Real Estate Valuation — cụm Spark phân tán + Kafka + Postgres + MinIO.
#
# Chạy trên 1 host (single-host cluster) bằng compose thường. Muốn multi-node
# thật (worker ở máy khác) -> xem DEPLOY.md mục "Multi-node": tách file này,
# đặt SPARK_MASTER=spark://<IP-master>:7077 và mở port.
#
# Mọi service ML (master/worker/ml-app) DÙNG CHUNG 1 image `build: .`.
# Secrets/config đọc từ .env (KHÔNG commit). Xem .env.example.
# ============================================================================

x-app-image: &app-image
  build:
    context: .
    args:
      SPARK_JARS_PACKAGES: ${SPARK_JARS_PACKAGES}
  image: realestate-ml:latest
  env_file: .env

services:
  # ---------- Object store: data lake + model binary (s3a) ----------
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tạo bucket + upload CSV seed macro (chạy 1 lần, thoát). Idempotent.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./data/raw_csv:/seed/raw_csv:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${AWS_ACCESS_KEY_ID} $${AWS_SECRET_ACCESS_KEY} &&
      mc mb -p local/$${MINIO_LAKE_BUCKET} &&
      mc mb -p local/$${MINIO_MODEL_BUCKET} &&
      mc cp --recursive /seed/raw_csv/ local/$${MINIO_LAKE_BUCKET}/raw_csv/ || true;
      echo 'minio-init done'"

  # ---------- Kafka (KRaft, single broker) ----------
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Postgres (serving layer M9) ----------
  postgres:
    image: postgres:15-alpine
    container_name: postgres_realestate
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${PG_USER} -d $${PG_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------- Spark standalone master ----------
  spark-master:
    <<: *app-image
    container_name: spark-master
    command: >
      bash -c "exec $$SPARK_HOME/bin/spark-class org.apache.spark.deploy.master.Master
               --host 0.0.0.0 --port 7077 --webui-port 8080"
    ports:
      - "7077:7077"   # cluster submit
      - "8080:8080"   # master web UI
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Spark workers (scale: docker compose up --scale spark-worker=3) ----------
  spark-worker:
    <<: *app-image
    command: >
      bash -c "exec $$SPARK_HOME/bin/spark-class org.apache.spark.deploy.worker.Worker
               spark://spark-master:7077 --webui-port 8081
               --cores $${SPARK_WORKER_CORES:-2} --memory $${SPARK_WORKER_MEMORY:-2g}"
    depends_on:
      spark-master:
        condition: service_healthy
    # KHÔNG map port cố định (nhiều worker) — Spark tự chọn.

  # ---------- Driver: chạy pipeline hằng ngày (ephemeral, gọi qua `compose run`) ----------
  ml-app:
    <<: *app-image
    depends_on:
      spark-master:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - models_meta:/app/models_meta          # JSON điều khiển (driver-local, bền)
      - ./data/raw_csv:/app/data/raw_csv:ro    # seed CSV cho replay_producer (python đọc)
      - ./logs:/app/logs
    # Không auto-start cùng `up`; gọi thủ công/cron:
    #   docker compose run --rm ml-app bash run_daily.sh
    profiles: ["job"]
    command: ["bash", "run_daily.sh"]

volumes:
  minio_data:
  postgres_data:
  models_meta:

networks:
  default:
    name: realestate-net
